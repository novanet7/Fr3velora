name: Ekstrak zip
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ekstrak
        run: |
          set -e
          Z=$(ls *.zip 2>/dev/null | head -n1)
          [ -n "$Z" ] || { echo "Tidak ada file .zip di akar repo"; exit 1; }
          unzip -q -o "$Z" -d _x
          rm "$Z"
          SRC=_x/android-app; [ -d "$SRC" ] || SRC=_x
          rm -rf "$SRC/.github"
          rm -rf app/src
          cp -a "$SRC"/. .
          rm -rf _x
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Update dari zip" || exit 0
          git push
      - name: Jalankan build APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apk.yml --ref ${{ github.ref_name }}
