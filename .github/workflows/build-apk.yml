name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

concurrency:
  group: build-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Ekstrak zip (jika ada)
        run: |
          set -e
          Z=$(ls *.zip 2>/dev/null | head -n1 || true)
          if [ -z "$Z" ]; then
            echo "Tidak ada zip, build dari isi repo"
            exit 0
          fi
          unzip -q -o "$Z" -d _x
          rm "$Z"
          SRC=_x/android-app; [ -d "$SRC" ] || SRC=_x
          rm -rf "$SRC/.github"
          rm -rf app/src
          cp -a "$SRC"/. .
          rm -rf _x
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Update dari zip" || true
          git push

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Terima lisensi Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null || true
          ls "$SDK/licenses"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.14.3

      - name: Siapkan keystore (jika ada)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK (release, ditandatangani)
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease -PVERSION_CODE=${{ github.run_number }}00 -PVERSION_NAME=2.0.${{ github.run_number }}

      - uses: actions/upload-artifact@v7
        with:
          name: fr3velora-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Terbitkan rilis & tautan unduh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$APK" fr3velora.apk
          TAG="v2.0.${{ github.run_number }}"
          gh release create "$TAG" fr3velora.apk --repo "${{ github.repository }}" \
            --title "fr3velora $TAG" --notes "APK build #${{ github.run_number }}" --latest
          REL="https://github.com/${{ github.repository }}/releases/tag/$TAG"
          DL="https://github.com/${{ github.repository }}/releases/latest/download/fr3velora.apk"
          {
            echo "## ✅ APK siap diunduh"
            echo ""
            echo "**Unduh langsung:** $DL"
            echo ""
            echo "Halaman rilis: $REL"
          } >> "$GITHUB_STEP_SUMMARY"
