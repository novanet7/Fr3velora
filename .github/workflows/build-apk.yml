name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Siapkan keystore (jika ada)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK (release, ditandatangani)
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease -PVERSION_CODE=${{ github.run_number }}00 -PVERSION_NAME=2.0.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: fr3velora-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Terbitkan rilis & tautan unduh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$APK" fr3velora.apk
          TAG="v2.0.${{ github.run_number }}"
          gh release create "$TAG" fr3velora.apk --repo "${{ github.repository }}" \
            --title "fr3velora $TAG" --notes "APK build #${{ github.run_number }}" --latest
          REL="https://github.com/${{ github.repository }}/releases/tag/$TAG"
          DL="https://github.com/${{ github.repository }}/releases/latest/download/fr3velora.apk"
          {
            echo "## ✅ APK siap diunduh"
            echo ""
            echo "**Unduh langsung:** $DL"
            echo ""
            echo "Halaman rilis: $REL"
          } >> "$GITHUB_STEP_SUMMARY"
